name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build archive
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer
      - name: Build the archive from the tag
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: trust-optimize-${{ github.ref_name }}
          path: |
            dist/trust-optimize-*.zip
            dist/trust-optimize-*.zip.sha256
          if-no-files-found: error
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/trust-optimize-*.zip dist/trust-optimize-*.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
